<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="description" content="Plantilla configurable de invitación de boda">
  <title>Invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="gate" id="gate" aria-label="Portada de invitación">
    <div class="gate-card">
      <div class="gate-names" data-names></div><div class="guestLine" id="guestLine"></div><div class="paxLine" id="paxLine"></div>
      <button class="env-wrap" id="envWrap" type="button" aria-label="Abrir invitación"><span class="seal">Abrir invitación</span></button>
    </div>
  </div>
  <main id="appContent" hidden>
    <section class="hero" id="inicio"><div class="heroContent container"><button id="musicBtn" class="music-btn" type="button" hidden>▶ Música</button><div class="heroNames" data-names></div><p class="heroInvite" id="invitationText"></p><div class="countNums" id="countNums"></div></div></section>
    <div id="sections"></div>
    <footer class="footer" id="footer"></footer>
  </main>
  <noscript>Esta invitación necesita JavaScript para cargar su configuración.</noscript>
</body>
</html>
