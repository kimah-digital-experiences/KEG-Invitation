<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="description" content="Plantilla configurable de invitación de boda">
  <title>Invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateNames" aria-describedby="gateHint">
    <div class="gate-card">
      <p class="gate-eyebrow" id="gateEyebrow"></p>
      <div class="gate-names" id="gateNames" data-names></div>
      <div class="guestLine" id="guestLine"></div>
      <div class="paxLine" id="paxLine"></div>
      <button class="env-wrap" id="envWrap" type="button" aria-describedby="gateHint" aria-expanded="false">
        <span class="envelope" aria-hidden="true">
          <span class="envelope-back"></span>
          <span class="envelope-letter">
            <span class="envelope-letter-kicker" id="envelopeLetterLabel"></span>
            <span class="envelope-letter-monogram" data-cover-monogram></span>
            <span class="envelope-letter-rule"></span>
          </span>
          <span class="envelope-pocket">
            <span class="envelope-fold envelope-fold-left"></span>
            <span class="envelope-fold envelope-fold-right"></span>
            <span class="envelope-fold envelope-fold-bottom"></span>
          </span>
          <span class="envelope-flap"></span>
          <span class="envelope-seal"><span data-cover-monogram></span></span>
        </span>
        <span class="envelope-action" id="envelopeOpenLabel"></span>
      </button>
      <p class="gate-hint" id="gateHint"></p>
    </div>
  </div>
  <main id="appContent" hidden>
    <section class="hero" id="inicio" tabindex="-1"><div class="heroContent container"><button id="musicBtn" class="music-btn" type="button" hidden>▶ Música</button><div class="heroNames" data-names></div><p class="heroInvite" id="invitationText"></p><div class="countNums" id="countNums"></div></div></section>
    <div id="sections"></div>
    <footer class="footer" id="footer"></footer>
  </main>
  <noscript>Esta invitación necesita JavaScript para cargar su configuración.</noscript>
</body>
</html>
